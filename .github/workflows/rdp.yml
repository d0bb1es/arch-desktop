name: rdp
on: workflow_dispatch

concurrency:
  group: rdp
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install desktop and VNC
        env:
          VNC_PASS: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -e
          if [ -z "$VNC_PASS" ]; then echo "VNC_PASSWORD secret is missing"; exit 1; fi
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies tigervnc-standalone-server novnc websockify dbus-x11
          mkdir -p ~/.vnc
          echo "$VNC_PASS" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          vncserver :1 -geometry 1366x768 -depth 24 -xstartup /usr/bin/startxfce4
          websockify -D --web /usr/share/novnc 6080 localhost:5901

      - name: Start tunnel
        run: |
          curl -fL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          setsid nohup ./cloudflared tunnel --url http://localhost:6080 --no-autoupdate > tunnel.log 2>&1 &
          for i in $(seq 1 40); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | grep -v '^https://api\.' | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then echo "No tunnel link found"; cat tunnel.log; exit 1; fi
          LINK="$URL/vnc.html?autoconnect=true&resize=remote"
          echo "::notice title=Desktop link::$LINK"
          echo "### Desktop link" >> "$GITHUB_STEP_SUMMARY"
          echo "$LINK" >> "$GITHUB_STEP_SUMMARY"

      - name: Transfer tools
        continue-on-error: true
        run: |
          sudo apt-get install -y rclone magic-wormhole aria2
          mkdir -p ~/share ~/Desktop
          cat > ~/serve.sh << 'EOF'
          #!/bin/bash
          read -r -s -p "Password (16+ letters/digits): " P; echo
          if [ ${#P} -lt 16 ]; then echo "Too short, need 16+"; exit 1; fi
          pkill rclone 2>/dev/null
          rclone serve http ~/share --addr 127.0.0.1:8000 --user nemo --pass "$P" > /tmp/rclone.log 2>&1 &
          sleep 2
          CF=$(find /home/runner/work -name cloudflared -type f | head -1)
          echo "Your link will appear below. Press Ctrl+C to stop."
          $CF tunnel --url http://localhost:8000 --no-autoupdate 2>&1 | grep --line-buffered -o 'https://[a-z0-9-]*\.trycloudflare\.com' | grep --line-buffered -v '^https://api\.'
          EOF
          chmod +x ~/serve.sh

      - name: Keep alive
        run: |
          while pgrep -f "cloudflared tunnel" > /dev/null; do sleep 30; done
